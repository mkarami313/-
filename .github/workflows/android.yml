name: Android CI

# Builds the DEMO debug APK and runs unit tests on a runner that has the Android SDK
# and full network access (GitHub-hosted runners do). The sandbox that scaffolds this
# repo has no Android SDK and cannot reach dl.google.com, so the APK is produced here.
#
# Download the built APK from the workflow run's "Artifacts" section (hamrah-demo-debug-apk).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Install exactly what the build needs. The default list includes the obsolete
          # 'tools' package, which no longer exists and fails the step.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # When the GOOGLE_SERVICES_JSON secret is set, write it so the build switches to the
      # real Firebase backend automatically. Without it, the build stays in DEMO mode.
      - name: Write google-services.json (enables Firebase backend)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase config written → FIREBASE backend"
          else
            echo "No GOOGLE_SERVICES_JSON secret → DEMO backend"
          fi

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK (DEMO backend)
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hamrah-demo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
